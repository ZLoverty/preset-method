name: Publish documentation PDF

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: 192.168.22.78:3000/polymaker/docs-pdf:1.0.0
    env:
      PDF_NAME: polymaker-filament-preset-tuning-guide-${{ github.ref_name }}.pdf
      RELEASE_API: ${{ github.api_url }}/repos/${{ github.repository }}/releases
      UPLOAD_API: ${{ github.upload_url }}/repos/${{ github.repository }}/releases
      RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}
      PDF_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Build PDF
        run: sh scripts/build-pdf.sh

      - name: Create or reuse the GitHub release
        id: release
        run: |
          set -eu
          release="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${RELEASE_API}/tags/${RELEASE_TAG}" || true)"

          if [ -z "$release" ]; then
            release="$(curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: Bearer ${RELEASE_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "Content-Type: application/json" \
              --data "{\"tag_name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${RELEASE_SHA}\",\"name\":\"${RELEASE_TAG}\"}" \
            "${RELEASE_API}")"
          fi

          release_id="$(printf '%s' "$release" | jq --raw-output '.id')"
          test "$release_id" != "null"
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

      - name: Replace the PDF attachment
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -eu
          existing_id="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${RELEASE_API}/${RELEASE_ID}/assets" \
            | jq --raw-output ".[] | select(.name == \"${PDF_NAME}\") | .id")"

          if [ -n "$existing_id" ]; then
            curl --silent --show-error --fail \
              --request DELETE \
              --header "Authorization: Bearer ${RELEASE_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${RELEASE_API}/${RELEASE_ID}/assets/${existing_id}"
          fi

          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer ${RELEASE_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/pdf" \
            --data-binary "@dist/${PDF_NAME}" \
            "${UPLOAD_API}/${RELEASE_ID}/assets?name=${PDF_NAME}"
